name: Supabase Keep Alive - PUNU DIES

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://qjyyjrqghsgttowgxmjd.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/problems?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "HTTP Status: $response"

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Supabase PUNU DIES berhasil diping."
          else
            echo "Ping gagal."
            exit 1
          fi
